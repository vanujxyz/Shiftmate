# Ravi's shift — the main demo scenario (PRD §9, TRD §8). Deterministic and seekable.
# Changes from the TRD text, approved by the project owner: heat values (D-005) and the skipped
# 10:30 break (D-006).
name: ravi_shift
title: {en: "Ravi's shift", hi: "रवि की शिफ़्ट", ta: "ரவியின் பணி நேரம்"}
site_id: CHN-HWY-01
date: "2026-09-24"
start: "06:58"
seed: 11
focus_machine: EXC001
operator: OP1001
language: ta
background_machines: 11          # other machines on the site run normally (world only, D-052)
background_machine_ids: [EXC002, EXC003, EXC004, EXC005, EXC006, EXC007, EXC008, WHL001, WHL002, DOZ001, DOZ002]
tasks:                           # EXC001's plan for the day
  - {task_type: truck_loading, planned_quantity: 18, quantity_unit: loads, zone_id: LOAD-A, scheduled_start: "07:10"}
  - {task_type: trenching, planned_quantity: 60, quantity_unit: m, zone_id: DIG-A, scheduled_start: "09:40"}
  - {task_type: backfilling, planned_quantity: 120, quantity_unit: m3, zone_id: DIG-A, scheduled_start: "12:40"}
weather_script:                  # overrides the generator from each time onwards
  - {at: "06:58", temp_c: 29, rh: 78, precip_mm_h: 0, ground: wet}
  - {at: "10:45", temp_c: 34, rh: 62}      # heat index ≈ 43 (D-005)
  - {at: "11:00", temp_c: 35, rh: 60}      # heat index ≈ 45 (D-005)
beats:
  - {id: sign_in,     at: "07:00", action: await_operator_sign_in, caption: {en: "Ravi signs in with his badge and chooses Tamil", hi: "रवि बैज से साइन इन करते हैं और तमिल चुनते हैं", ta: "ரவி பேட்ஜ் மூலம் உள்நுழைந்து தமிழைத் தேர்வு செய்கிறார்"}}
  - {id: cold_start,  at: "07:02", action: engine_start, params: {coolant_c: 32}, caption: {en: "Cold start: the engine warms up", hi: "ठंडा इंजन: वार्म-अप हो रहा है", ta: "குளிர்ந்த இன்ஜின்: சூடாகிறது"}}
  - {id: my_shift,    at: "07:15", action: note, caption: {en: "Estimates reflect wet ground", hi: "अनुमान में गीली ज़मीन शामिल है", ta: "மதிப்பீட்டில் ஈரமான தரை கணக்கில் உள்ளது"}}
  - {id: truck_delay, at: "08:10", action: truck_shortage, params: {zone: LOAD-A, minutes: 18}, caption: {en: "No trucks reach LOAD-A for 18 minutes", hi: "18 मिनट तक LOAD-A पर कोई ट्रक नहीं आता", ta: "18 நிமிடம் LOAD-A-க்கு லாரி வரவில்லை"}}
  - {id: worker_near, at: "09:30", speed: 1, action: camera_or_sim_person, params: {path: [[14, 0], [8, 0], [5, 0], [3, 0]], seconds_per_step: 4}, caption: {en: "A worker walks into the swing zone", hi: "एक मज़दूर घुमाव के दायरे में आता है", ta: "ஒரு தொழிலாளி சுழலும் பகுதிக்குள் நுழைகிறார்"}}
  - {id: seatbelt,    at: "10:20", speed: 1, action: set_signal, params: {seatbelt_fastened: false, while: working, seconds: 20}, caption: {en: "Ravi unbuckles while working", hi: "रवि काम करते हुए बेल्ट खोल देते हैं", ta: "ரவி வேலை செய்யும்போது பெல்ட்டைக் கழற்றுகிறார்"}}
  - {id: skip_break,  at: "10:30", action: skip_scheduled_break, caption: {en: "Ravi keeps working to catch up after the truck delay", hi: "ट्रक की देरी के बाद रवि काम जारी रखते हैं", ta: "லாரி தாமதத்துக்குப் பிறகு ரவி தொடர்ந்து வேலை செய்கிறார்"}}
  - {id: heat,        at: "11:00", action: note, caption: {en: "Heat index 45 °C", hi: "हीट इंडेक्स 45 °C", ta: "வெப்பக் குறியீடு 45 °C"}}
  - {id: step_out,    at: "11:40", action: operator_leaves_seat, params: {minutes: 6, engine_on: true}, caption: {en: "Ravi steps out with the engine running", hi: "रवि इंजन चालू छोड़कर उतरते हैं", ta: "இன்ஜின் ஓடும்போது ரவி இறங்குகிறார்"}}
  - {id: near_miss,   at: "12:10", action: await_voice_report, caption: {en: "Ravi reports a near miss by voice", hi: "रवि बोलकर बाल-बाल बचने की रिपोर्ट देते हैं", ta: "ரவி குரல் மூலம் நூலிழையில் தப்பியதைப் புகார் செய்கிறார்"}}
  - {id: offline,     at: "13:00", action: set_network, params: {online: false}, caption: {en: "The site loses internet", hi: "साइट पर इंटरनेट चला जाता है", ta: "தளத்தில் இணையம் துண்டிக்கப்படுகிறது"}}
  - {id: online,      at: "13:08", action: set_network, params: {online: true}, caption: {en: "Internet is back: everything syncs", hi: "इंटरनेट वापस: सब सिंक हो जाता है", ta: "இணையம் திரும்பியது: அனைத்தும் ஒத்திசைகிறது"}}
  - {id: end_shift,   at: "14:00", action: end_shift_summary, caption: {en: "End of shift: Ravi's private My Day", hi: "शिफ़्ट ख़त्म: रवि का निजी 'मेरा दिन'", ta: "பணி முடிவு: ரவியின் தனிப்பட்ட 'என் நாள்'"}}
