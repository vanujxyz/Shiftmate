ui.coach.went_well_text: {en: "18 of 18 loads. Loading cycle 21 s, 2 s faster than last week.", hi: "18 में से 18 लोड। लोडिंग साइकिल 21 सेकंड, पिछले हफ़्ते से 2 सेकंड तेज़।", ta: "18-க்கு 18 லோடு. ஏற்றும் சுழற்சி 21 வினாடி — கடந்த வாரத்தைவிட 2 வினாடி வேகம்."}  # (D)
ui.coach.idle_why_truck: {en: "Trucks were late 10:10–10:40", hi: "ट्रक 10:10–10:40 देर से आए", ta: "லாரிகள் 10:10–10:40 தாமதமாக வந்தன"}
ui.coach.idle_why_cab: {en: "The engine ran 10 min with the cab empty. Switching off for stops over 5 min saves about 1 L.", hi: "केबिन खाली था और इंजन 10 मिनट चला। 5 मिनट से लंबे रुकने पर इंजन बंद करें, करीब 1 लीटर बचेगा।", ta: "கேபின் காலியாக இருந்தபோது இன்ஜின் 10 நிமிடம் ஓடியது. 5 நிமிடத்துக்கு மேல் நின்றால் அணைத்தால் சுமார் 1 லிட்டர் மிச்சம்."}  # (D)
ui.coach.idle_why_unknown: {en: "The sensors could not tell why", hi: "सेंसर से कारण पता नहीं चला", ta: "காரணத்தை சென்சார்களால் அறிய முடியவில்லை"}
