ui.learn.minutes: {en: "{{minutes}} min · narrated", hi: "{{minutes}} मिनट · सुनाया हुआ", ta: "{{minutes}} நிமிடம் · விவரிப்புடன்"}
ui.learn.paused_only: {en: "Drills run only while the machine is parked.", hi: "ड्रिल सिर्फ़ मशीन खड़ी होने पर चलती है।", ta: "இயந்திரம் நின்றிருக்கும்போது மட்டுமே பயிற்சி நடக்கும்."}
ui.learn.lesson_sentence: {en: "Park the truck so you swing less than 90°.", hi: "ट्रक ऐसे लगवाइए कि 90° से कम घुमाना पड़े।", ta: "90°-க்குக் குறைவாகச் சுழலும்படி லாரியை நிறுத்தச் சொல்லுங்கள்."}  # (D)
ui.learn.lesson_fact: {en: "Each 90° less saves about 3 s a load.", hi: "हर 90° कम घुमाने से एक लोड पर करीब 3 सेकंड बचते हैं।", ta: "ஒவ்வொரு 90° குறைவுக்கும் ஒரு லோடுக்கு சுமார் 3 வினாடி மிச்சம்."}
ui.learn.progress: {en: "Card {{card}} of {{cards}}", hi: "{{cards}} में से कार्ड {{card}}", ta: "{{cards}}-ல் அட்டை {{card}}"}
ui.learn.quiz_right: {en: "Stop, then buckle up before you move again", hi: "रुकिए, फिर चलाने से पहले बेल्ट लगाइए", ta: "நிறுத்துங்கள், மீண்டும் நகரும் முன் பெல்ட் போடுங்கள்"}
ui.learn.quiz_wrong: {en: "Keep working and buckle up at the break", hi: "काम चालू रखें और ब्रेक में बेल्ट लगाएँ", ta: "வேலையைத் தொடர்ந்து இடைவேளையில் பெல்ட் போடுங்கள்"}
ui.learn.quiz_why: {en: "The belt only helps if it is on when something goes wrong.", hi: "बेल्ट तभी बचाती है जब हादसे के समय लगी हो।", ta: "ஏதாவது நடக்கும்போது பெல்ட் போட்டிருந்தால்தான் அது காக்கும்."}
ui.learn.slot_who: {en: "Cat dealer training centre", hi: "Cat डीलर प्रशिक्षण केंद्र", ta: "Cat டீலர் பயிற்சி மையம்"}
ui.learn.slot_where: {en: "Chennai, Ambattur", hi: "चेन्नई, अंबत्तूर", ta: "சென்னை, அம்பத்தூர்"}
