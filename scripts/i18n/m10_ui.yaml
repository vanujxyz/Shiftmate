ui.ask.you_asked: {en: "You asked: {{question}}", hi: "आपने पूछा: {{question}}", ta: "நீங்கள் கேட்டது: {{question}}"}
ui.ask.offline_tag: {en: "Offline answer, from the manual saved on 18 Sep.", hi: "ऑफ़लाइन जवाब, 18 सितंबर को सेव की गई मैनुअल से।", ta: "இணைப்பில்லாத பதில் — 18 செப்டம்பர் அன்று சேமித்த கையேட்டிலிருந்து."}  # (D)
ui.ask.dont_know: {en: "I don't know. It isn't in the manuals on this machine, and I won't guess.", hi: "मुझे नहीं पता। यह इस मशीन की मैनुअल में नहीं है, और मैं अंदाज़ा नहीं लगाऊँगा।", ta: "எனக்குத் தெரியாது. இந்த இயந்திரத்தின் கையேட்டில் இல்லை; நான் ஊகிக்க மாட்டேன்."}  # (D)
ui.ask.sample_question: {en: "How often do I check the seatbelt?", hi: "सीट बेल्ट कितनी बार जाँचूँ?", ta: "சீட் பெல்ட்டை எவ்வளவு அடிக்கடி சரிபார்க்க வேண்டும்?"}
ui.ask.sample_answer: {en: "Check it at every walkaround, before you start the engine.", hi: "हर वॉकअराउंड में, इंजन चालू करने से पहले जाँचें।", ta: "ஒவ்வொரு சுற்றுப் பார்வையிலும், இன்ஜினை இயக்கும் முன் சரிபாருங்கள்."}
ui.ask.sample_source: {en: "Operator guide", hi: "ऑपरेटर गाइड", ta: "இயக்குநர் வழிகாட்டி"}
