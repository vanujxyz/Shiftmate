ui.state.offline_text: {en: "Everything still works. {{count}} reports will send when the signal is back.", hi: "सब काम कर रहा है। सिग्नल आते ही {{count}} रिपोर्ट चली जाएँगी।", ta: "எல்லாம் வேலை செய்கிறது. சிக்னல் வந்ததும் {{count}} அறிக்கைகள் போகும்."}  # (D)
ui.state.error_title: {en: "This screen could not load", hi: "यह स्क्रीन नहीं खुली", ta: "இந்தத் திரை திறக்கவில்லை"}
