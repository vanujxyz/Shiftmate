# Milestone 15 strings: voice commands, checklist by voice, rear camera panel.
ui.voice.next_task: {en: "Next: {{task}} at {{zone}}, starting {{time}}.", hi: "अगला: {{zone}} पर {{task}}, {{time}} बजे से।", ta: "அடுத்து: {{zone}}-இல் {{task}}, {{time}}-க்குத் தொடக்கம்."}
ui.voice.no_next: {en: "No more tasks today.", hi: "आज और कोई काम नहीं।", ta: "இன்று வேறு வேலை இல்லை."}
ui.voice.time_left: {en: "About {{time}} left on {{task}}.", hi: "{{task}} में लगभग {{time}} बाकी।", ta: "{{task}}-இல் சுமார் {{time}} மீதம்."}
ui.voice.no_estimate: {en: "No estimate yet. It comes once the task has started.", hi: "अभी अनुमान नहीं। काम शुरू होने पर आएगा।", ta: "இன்னும் மதிப்பீடு இல்லை. வேலை தொடங்கியதும் வரும்."}
ui.voice.break_start: {en: "Park safely and switch off. Your break counts while the engine is off.", hi: "सुरक्षित खड़ी करें और इंजन बंद करें। इंजन बंद रहने तक ब्रेक गिना जाएगा।", ta: "பாதுகாப்பாக நிறுத்தி இன்ஜினை அணையுங்கள். இன்ஜின் அணைந்திருக்கும் வரை இடைவேளையாகக் கணக்கிடப்படும்."}
ui.voice.break_end: {en: "Welcome back. Look around the machine before you start.", hi: "वापसी पर स्वागत। शुरू करने से पहले मशीन के चारों ओर देखें।", ta: "மீண்டும் வருக. தொடங்கும் முன் இயந்திரத்தைச் சுற்றிப் பாருங்கள்."}
ui.voice.help: {en: "You can say: next task, how long left, report a problem, repeat, or ask a question.", hi: "आप कह सकते हैं: अगला काम, कितना समय बाकी, समस्या बताओ, दोहराओ, या कोई सवाल पूछें।", ta: "நீங்கள் சொல்லலாம்: அடுத்த வேலை, எவ்வளவு நேரம், பிரச்சினை, மீண்டும் சொல், அல்லது ஒரு கேள்வி கேளுங்கள்."}
ui.voice.acked: {en: "Done.", hi: "हो गया।", ta: "முடிந்தது."}
ui.voice.no_alert: {en: "There is no alert to acknowledge.", hi: "मानने के लिए कोई चेतावनी नहीं है।", ta: "ஒப்புக்கொள்ள எச்சரிக்கை எதுவும் இல்லை."}
ui.voice.nothing_to_repeat: {en: "Nothing to repeat yet.", hi: "अभी दोहराने को कुछ नहीं।", ta: "இன்னும் மீண்டும் சொல்ல எதுவும் இல்லை."}
ui.voice.not_supported: {en: "Voice is not available in this browser. Use the buttons.", hi: "इस ब्राउज़र में आवाज़ उपलब्ध नहीं है। बटन इस्तेमाल करें।", ta: "இந்த உலாவியில் குரல் வசதி இல்லை. பட்டன்களைப் பயன்படுத்துங்கள்."}
ui.voice.no_mic: {en: "The microphone is blocked. Allow it in the browser, or use the buttons.", hi: "माइक्रोफ़ोन बंद है। ब्राउज़र में अनुमति दें, या बटन इस्तेमाल करें।", ta: "மைக்ரோஃபோன் தடுக்கப்பட்டுள்ளது. உலாவியில் அனுமதியுங்கள், அல்லது பட்டன்களைப் பயன்படுத்துங்கள்."}
ui.voice.checklist_button: {en: "Answer by voice", hi: "बोलकर जवाब दें", ta: "குரல் மூலம் பதில்"}
ui.voice.checklist_hint: {en: "The item is read out. Say OK or Problem, or All OK for the rest.", hi: "बात पढ़कर सुनाई जाएगी। ठीक या समस्या कहें, या बाकी सबके लिए सब ठीक।", ta: "ஒவ்வொன்றும் படிக்கப்படும். சரி அல்லது பிரச்சினை என்று சொல்லுங்கள், மீதிக்கு எல்லாம் சரி."}

ui.cam.title: {en: "Rear camera", hi: "पीछे का कैमरा", ta: "பின் கேமரா"}
ui.cam.intro: {en: "See who is behind the machine. The camera finds people on this tablet; only the distance is sent, never pictures.", hi: "देखें मशीन के पीछे कौन है। कैमरा इसी टैबलेट पर लोगों को पहचानता है; सिर्फ़ दूरी भेजी जाती है, तस्वीरें कभी नहीं।", ta: "இயந்திரத்துக்குப் பின்னால் யார் இருக்கிறார்கள் எனப் பாருங்கள். இந்த டேப்லெட்டிலேயே கேமரா ஆட்களைக் கண்டறிகிறது; தூரம் மட்டுமே அனுப்பப்படும், படங்கள் ஒருபோதும் இல்லை."}
ui.cam.turn_on: {en: "Turn on camera", hi: "कैमरा चालू करें", ta: "கேமராவை இயக்கு"}
ui.cam.turn_off: {en: "Turn off camera", hi: "कैमरा बंद करें", ta: "கேமராவை அணை"}
ui.cam.starting: {en: "Starting the camera…", hi: "कैमरा चालू हो रहा है…", ta: "கேமரா தொடங்குகிறது…"}
ui.cam.no_permission: {en: "The camera is blocked. Allow it in the browser, then turn it on again.", hi: "कैमरा बंद है। ब्राउज़र में अनुमति दें, फिर चालू करें।", ta: "கேமரா தடுக்கப்பட்டுள்ளது. உலாவியில் அனுமதித்து மீண்டும் இயக்குங்கள்."}
ui.cam.no_camera: {en: "No camera was found on this tablet.", hi: "इस टैबलेट पर कोई कैमरा नहीं मिला।", ta: "இந்த டேப்லெட்டில் கேமரா இல்லை."}
ui.cam.failed: {en: "The person detector could not start. The machine's own sensors still work.", hi: "व्यक्ति पहचानने वाला सिस्टम शुरू नहीं हो सका। मशीन के अपने सेंसर काम कर रहे हैं।", ta: "ஆட்களைக் கண்டறியும் அமைப்பு தொடங்கவில்லை. இயந்திரத்தின் சொந்த சென்சார்கள் வேலை செய்கின்றன."}
ui.cam.person: {en: "One person {{distance}} from the camera.", hi: "कैमरे से {{distance}} दूर एक व्यक्ति।", ta: "கேமராவிலிருந்து {{distance}} தொலைவில் ஒருவர்."}
ui.cam.nobody: {en: "Nobody in view.", hi: "कोई दिखाई नहीं दे रहा।", ta: "யாரும் தெரியவில்லை."}
ui.cam.calibrated: {en: "Calibrated on this tablet.", hi: "इस टैबलेट पर कैलिब्रेट किया गया।", ta: "இந்த டேப்லெட்டில் அளவீடு செய்யப்பட்டது."}
ui.cam.not_calibrated: {en: "Not calibrated: distances are approximate.", hi: "कैलिब्रेट नहीं: दूरियाँ अंदाज़न हैं।", ta: "அளவீடு செய்யவில்லை: தூரங்கள் தோராயமானவை."}
ui.cam.calibrate: {en: "Calibrate (stand at {{distance}} m)", hi: "कैलिब्रेट करें ({{distance}} मीटर पर खड़े हों)", ta: "அளவீடு செய் ({{distance}} மீட்டரில் நில்லுங்கள்)"}
ui.cam.measuring: {en: "Measuring… stand still {{distance}} m from the camera.", hi: "माप रहा है… कैमरे से {{distance}} मीटर पर स्थिर खड़े रहें।", ta: "அளக்கிறது… கேமராவிலிருந்து {{distance}} மீட்டரில் அசையாமல் நில்லுங்கள்."}
ui.cam.test: {en: "Test accuracy", hi: "सटीकता जाँचें", ta: "துல்லியத்தைச் சோதி"}
ui.cam.test_hint: {en: "Stand at the chosen distance and record {{count}} readings. Repeat at each distance, then send the results.", hi: "चुनी गई दूरी पर खड़े होकर {{count}} माप लें। हर दूरी पर दोहराएँ, फिर नतीजे भेजें।", ta: "தேர்ந்தெடுத்த தூரத்தில் நின்று {{count}} அளவீடுகளைப் பதிவு செய்யுங்கள். ஒவ்வொரு தூரத்திலும் மீண்டும் செய்து முடிவுகளை அனுப்புங்கள்."}
ui.cam.true_distance: {en: "True distance", hi: "असली दूरी", ta: "உண்மையான தூரம்"}
ui.cam.record: {en: "Record {{count}} readings", hi: "{{count}} माप लें", ta: "{{count}} அளவீடுகளைப் பதிவு செய்"}
ui.cam.recording: {en: "Recording {{done}} of {{total}}…", hi: "{{total}} में से {{done}} ले रहा है…", ta: "{{total}}-ல் {{done}} பதிவாகிறது…"}
ui.cam.send: {en: "Send {{count}} readings", hi: "{{count}} माप भेजें", ta: "{{count}} அளவீடுகளை அனுப்பு"}
ui.cam.sent: {en: "{{count}} readings saved on the gateway.", hi: "{{count}} माप गेटवे पर सहेजे गए।", ta: "{{count}} அளவீடுகள் நுழைவாயிலில் சேமிக்கப்பட்டன."}
ui.cam.send_failed: {en: "The readings could not be sent. Try again.", hi: "माप भेजे नहीं जा सके। फिर कोशिश करें।", ta: "அளவீடுகளை அனுப்ப முடியவில்லை. மீண்டும் முயலுங்கள்."}
