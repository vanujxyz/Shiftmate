ui.fl.bench: {en: "Measured on this computer: {{cpu}} ms CPU per machine per second of work, {{mem}} MB memory per machine, {{kb}} kB uplink per machine per hour", hi: "इस कंप्यूटर पर मापा गया: हर मशीन के हर सेकंड के काम पर {{cpu}} ms CPU, हर मशीन {{mem}} MB मेमोरी, हर मशीन हर घंटे {{kb}} kB अपलिंक", ta: "இந்தக் கணினியில் அளக்கப்பட்டது: ஒவ்வொரு இயந்திரத்தின் ஒரு வினாடி வேலைக்கு {{cpu}} ms CPU, இயந்திரத்துக்கு {{mem}} MB நினைவகம், இயந்திரத்துக்கு மணிக்கு {{kb}} kB அப்லிங்க்"}
ui.fl.projection: {en: "Projection for {{machines}} machines: {{gb}} GB uplink a day, {{rps}} records per second, {{nodes}} ingest nodes at the measured rate", hi: "{{machines}} मशीनों का अनुमान: रोज़ {{gb}} GB अपलिंक, हर सेकंड {{rps}} रिकॉर्ड, मापी गई दर पर {{nodes}} इन्जेस्ट नोड", ta: "{{machines}} இயந்திரங்களுக்கான கணிப்பு: நாளுக்கு {{gb}} GB அப்லிங்க், வினாடிக்கு {{rps}} பதிவுகள், அளந்த வேகத்தில் {{nodes}} பெறும் கணுக்கள்"}
ui.fl.projection_note: {en: "Projection, not measured. Basis: {{basis}}.", hi: "यह अनुमान है, मापा नहीं गया। आधार: {{basis}}।", ta: "இது கணிப்பு, அளக்கப்படவில்லை. அடிப்படை: {{basis}}."}
