ui.fl.patterns_note: {en: "Learned from finished tasks across all sites; each line shows how much more time a condition takes.", hi: "सभी साइटों के पूरे हुए कामों से सीखा; हर पंक्ति बताती है कि कोई हालत कितना ज़्यादा समय लेती है।", ta: "எல்லாத் தளங்களிலும் முடிந்த வேலைகளிலிருந்து கற்றது; ஒவ்வொரு வரியும் ஒரு நிலை எவ்வளவு கூடுதல் நேரம் எடுக்கிறது எனக் காட்டுகிறது."}
