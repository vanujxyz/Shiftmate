ui.ev.source: {en: "Results from docs/EVAL.md, written by \"shiftmate eval all\" on held-out test days. They are shown as written, in English.", hi: "नतीजे docs/EVAL.md से, जिसे \"shiftmate eval all\" अलग रखे गए टेस्ट दिनों पर लिखता है। ये जैसे लिखे गए हैं वैसे, अंग्रेज़ी में दिखाए गए हैं।", ta: "முடிவுகள் docs/EVAL.md-இலிருந்து; \"shiftmate eval all\" தனியாக வைத்த சோதனை நாட்களில் எழுதியவை. எழுதியபடியே ஆங்கிலத்தில் காட்டப்படுகின்றன."}
