reason.ground_wet_slower: {en: "Wet ground adds time", hi: "गीली ज़मीन से समय बढ़ेगा", ta: "ஈரமான தரையால் நேரம் கூடும்"}
reason.ground_muddy_slower: {en: "Muddy ground adds time", hi: "कीचड़ से समय बढ़ेगा", ta: "சேற்றால் நேரம் கூடும்"}
reason.ground_rocky_slower: {en: "Rocky ground adds time", hi: "पथरीली ज़मीन से समय बढ़ेगा", ta: "பாறைத் தரையால் நேரம் கூடும்"}
