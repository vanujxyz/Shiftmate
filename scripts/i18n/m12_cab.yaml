evidence.in_break_window: {en: "During the scheduled break", hi: "तय ब्रेक के समय", ta: "திட்டமிட்ட இடைவேளையின்போது"}
evidence.after_engine_start: {en: "Right after the engine started", hi: "इंजन चालू होते ही", ta: "இன்ஜின் தொடங்கிய உடனே"}
evidence.coolant_cold: {en: "coolant still cold", hi: "कूलेंट अभी ठंडा", ta: "கூலன்ட் இன்னும் குளிர்ச்சி"}
evidence.time_based: {en: "normal warm-up time", hi: "सामान्य वार्म-अप समय", ta: "வழக்கமான சூடேற்ற நேரம்"}
evidence.seat_empty: {en: "The seat sensor showed nobody in the seat", hi: "सीट सेंसर के अनुसार सीट पर कोई नहीं था", ta: "இருக்கை சென்சார்: இருக்கையில் யாரும் இல்லை"}
evidence.no_truck_sensor: {en: "No truck at the loading point", hi: "लोडिंग की जगह पर कोई ट्रक नहीं था", ta: "ஏற்றும் இடத்தில் லாரி இல்லை"}
evidence.no_truck_dispatch_log: {en: "No truck in the dispatch log", hi: "डिस्पैच रिकॉर्ड में कोई ट्रक नहीं", ta: "அனுப்புதல் பதிவில் லாரி இல்லை"}
evidence.seated_idle: {en: "Machine still with the operator seated", hi: "ऑपरेटर बैठे थे, मशीन रुकी थी", ta: "ஆபரேட்டர் அமர்ந்திருக்க இயந்திரம் நின்றது"}
evidence.long_idle: {en: "stops of a few minutes with the engine on", hi: "इंजन चालू रखकर कुछ मिनट के ठहराव", ta: "இன்ஜின் ஓடியபடி சில நிமிட நிறுத்தங்கள்"}
evidence.seat_not_sensed: {en: "this machine has no seat sensor", hi: "इस मशीन में सीट सेंसर नहीं है", ta: "இந்த இயந்திரத்தில் இருக்கை சென்சார் இல்லை"}
evidence.no_clear_cause: {en: "The sensors could not tell why", hi: "सेंसर वजह नहीं बता सके", ta: "காரணத்தை சென்சார்களால் சொல்ல முடியவில்லை"}

