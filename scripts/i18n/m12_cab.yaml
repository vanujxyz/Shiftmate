report.severity.medium: {en: "Serious", hi: "गंभीर", ta: "கடுமையானது"}
report.severity.high: {en: "Very serious", hi: "बहुत गंभीर", ta: "மிகக் கடுமையானது"}

ui.btn.yes: {en: "Yes", hi: "हाँ", ta: "ஆம்"}
ui.btn.no: {en: "No", hi: "नहीं", ta: "இல்லை"}
ui.report.title: {en: "Report", hi: "रिपोर्ट", ta: "புகார்"}
ui.report.new: {en: "What do you want to report?", hi: "आप क्या रिपोर्ट करना चाहते हैं?", ta: "எதைப் புகார் செய்ய விரும்புகிறீர்கள்?"}
ui.report.what_prompt: {en: "What happened? A few words are enough.", hi: "क्या हुआ? कुछ शब्द काफ़ी हैं।", ta: "என்ன நடந்தது? சில வார்த்தைகள் போதும்."}
ui.report.people_q: {en: "Were people involved?", hi: "क्या लोग शामिल थे?", ta: "ஆட்கள் சம்பந்தப்பட்டார்களா?"}
ui.report.injury_q: {en: "Was anyone hurt?", hi: "क्या किसी को चोट लगी?", ta: "யாருக்காவது காயம் பட்டதா?"}
ui.report.severity: {en: "How serious", hi: "कितना गंभीर", ta: "எவ்வளவு கடுமை"}
ui.report.people_yes: {en: "Yes, people were involved", hi: "हाँ, लोग शामिल थे", ta: "ஆம், ஆட்கள் சம்பந்தப்பட்டனர்"}
ui.report.people_no: {en: "No people involved", hi: "कोई व्यक्ति शामिल नहीं", ta: "ஆட்கள் யாரும் இல்லை"}
ui.report.injury_yes: {en: "Someone was hurt", hi: "किसी को चोट लगी", ta: "ஒருவருக்குக் காயம்"}
ui.report.where_value: {en: "{{zone}} · {{time}}", hi: "{{zone}} · {{time}}", ta: "{{zone}} · {{time}}"}
ui.report.where_later: {en: "Filled in when it reaches the machine", hi: "मशीन तक पहुँचने पर भरा जाएगा", ta: "இயந்திரத்தை அடைந்ததும் நிரப்பப்படும்"}
ui.report.what_empty: {en: "No words added", hi: "कोई शब्द नहीं जोड़े", ta: "வார்த்தைகள் சேர்க்கப்படவில்லை"}
ui.report.auto: {en: "Time, machine, place, task and weather are filled in for you.", hi: "समय, मशीन, जगह, काम और मौसम अपने-आप भर जाते हैं।", ta: "நேரம், இயந்திரம், இடம், வேலை, வானிலை தானாக நிரப்பப்படும்."}
ui.report.sent: {en: "Report saved. Your supervisor will see it.", hi: "रिपोर्ट सहेजी गई। आपके सुपरवाइज़र इसे देखेंगे।", ta: "புகார் சேமிக்கப்பட்டது. உங்கள் மேற்பார்வையாளர் பார்ப்பார்."}
ui.report.queued: {en: "Saved on this tablet. It goes to the machine as soon as it reconnects.", hi: "इस टैबलेट पर सहेजी गई। मशीन से जुड़ते ही भेजी जाएगी।", ta: "இந்த டேப்லெட்டில் சேமிக்கப்பட்டது. இயந்திரத்துடன் இணைந்ததும் அனுப்பப்படும்."}
ui.report.recent: {en: "Your recent reports", hi: "आपकी हाल की रिपोर्ट", ta: "உங்கள் சமீபத்திய புகார்கள்"}
ui.report.none: {en: "No reports yet.", hi: "अभी कोई रिपोर्ट नहीं।", ta: "இதுவரை புகார் இல்லை."}
ui.report.synced: {en: "Sent to the office", hi: "दफ़्तर भेजी गई", ta: "அலுவலகத்துக்கு அனுப்பப்பட்டது"}
ui.report.waiting: {en: "Waiting for internet", hi: "इंटरनेट का इंतज़ार", ta: "இணையத்துக்காகக் காத்திருக்கிறது"}
ui.report.on_tablet: {en: "On this tablet, not at the machine yet", hi: "इस टैबलेट पर, अभी मशीन तक नहीं", ta: "இந்த டேப்லெட்டில், இன்னும் இயந்திரத்தை அடையவில்லை"}
ui.report.failed: {en: "The report could not be checked. Try again.", hi: "रिपोर्ट जाँची नहीं जा सकी। फिर कोशिश करें।", ta: "புகாரைச் சரிபார்க்க முடியவில்லை. மீண்டும் முயலுங்கள்."}
ui.report.another: {en: "New report", hi: "नई रिपोर्ट", ta: "புதிய புகார்"}
ui.report.text_label: {en: "Report text", hi: "रिपोर्ट का लेख", ta: "புகார் உரை"}

