report.type.near_miss: {en: "Near miss", hi: "बाल-बाल बचे", ta: "நூலிழையில் தப்பியது"}
report.type.equipment_problem: {en: "Machine problem", hi: "मशीन में ख़राबी", ta: "இயந்திரக் கோளாறு"}
report.hint.incident: {en: "Someone was hurt or something was damaged", hi: "किसी को चोट लगी या कुछ टूटा", ta: "யாருக்காவது காயம் அல்லது ஏதாவது சேதம்"}
report.hint.near_miss: {en: "Something almost happened", hi: "कुछ होते-होते बचा", ta: "ஏதோ நடக்க இருந்தது"}
report.hint.equipment_problem: {en: "Something on the machine is wrong", hi: "मशीन में कुछ ठीक नहीं है", ta: "இயந்திரத்தில் ஏதோ சரியில்லை"}
