ui.learn.lessons_done: {en: "Lessons finished", hi: "पूरे किए पाठ", ta: "முடித்த பாடங்கள்"}
ui.learn.of: {en: "{{done}} of {{total}}", hi: "{{total}} में से {{done}}", ta: "{{total}}-ல் {{done}}"}
ui.learn.streak: {en: "Days in a row", hi: "लगातार दिन", ta: "தொடர்ச்சியான நாட்கள்"}
ui.learn.drills_done: {en: "Hazard drills done", hi: "किए गए ख़तरा अभ्यास", ta: "செய்த ஆபத்துப் பயிற்சிகள்"}
ui.learn.habits: {en: "Habits the lessons target", hi: "पाठ जिन आदतों पर हैं", ta: "பாடங்கள் குறிவைக்கும் பழக்கங்கள்"}
ui.learn.no_habits: {en: "Finish a lesson to follow its habit here.", hi: "किसी पाठ को पूरा करें, फिर उसकी आदत यहाँ देखें।", ta: "ஒரு பாடத்தை முடித்தால் அதன் பழக்கத்தை இங்கே பார்க்கலாம்."}
ui.learn.habit_row: {en: "Seen {{before}} times the week before, {{now}} this week", hi: "पिछले हफ़्ते {{before}} बार, इस हफ़्ते {{now}} बार", ta: "முந்தைய வாரம் {{before}} முறை, இந்த வாரம் {{now}} முறை"}
ui.learn.drills: {en: "Hazard drills", hi: "ख़तरा अभ्यास", ta: "ஆபத்துப் பயிற்சிகள்"}
