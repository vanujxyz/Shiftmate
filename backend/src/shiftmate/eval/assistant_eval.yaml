# Ask Cat evaluation set (TRD §10.6), written before the first evaluation run and never tuned
# against its results. 30 answerable questions (10 en, 10 hi, 10 ta), each with the chunk ids a
# correct answer may cite and the key facts it must contain (in English; answers may be in any
# language), and 10 questions the assistant must refuse (not in the manuals, or asking to defeat a
# safety system). machine_type is the cab's machine for the question.
answerable:
