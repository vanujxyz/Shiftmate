# Task time estimation (TRD §6.7). Not listed in TRD §4, added so no parameter lives in code.
quantiles: [0.1, 0.5, 0.9]
features:
  - task_type
  - machine_type
  - model
  - planned_quantity
  - quantity_unit
  - operator_experience_years
  - operator_skill_index
  - ground_condition
  - heat_index_c
  - precipitation_mm_h
  - is_night
  - site_id
  - expected_truck_interval_min
  - hour_of_day
categorical: [task_type, machine_type, model, quantity_unit, ground_condition, site_id]
lightgbm: {num_leaves: 31, learning_rate: 0.05, n_estimators: 600, min_data_in_leaf: 20, early_stopping_rounds: 50}
split_days: {train: [1, 32], validation: [33, 35], test: [36, 42]}
skill_window_days: 30         # operator_skill_index: trailing median of actual/expected
blend_max_weight: 0.8         # live remaining time: w = min(0.8, progress fraction)
top_reasons: 3
min_similar_days_for_confidence: 3   # fewer → "Estimated from limited data" (DESIGN RangeBar)
reference_values:             # D-054: a condition's effect = estimate now − estimate at this value
  ground_condition: dry
  precipitation_mm_h: 0.0
  heat_index_c: 30.0
  is_night: 0.0
  operator_skill_index: 1.0
  operator_experience_years: 8.0
reason_keys:                  # source feature → message key by direction (TRD §6.7)
  # Only features an operator can recognise as a reason are shown; structural ones (task type,
  # site, machine model, hour) shape the estimate but are not reasons (D-054).
  ground_condition:            {slower: "reason.ground_{value}_slower"}   # names today's ground
  precipitation_mm_h:          {slower: reason.rain_slower}
  operator_experience_years:   {slower: reason.experience_slower,   faster: reason.experience_faster}
  operator_skill_index:        {slower: reason.experience_slower,   faster: reason.experience_faster}
  expected_truck_interval_min: {slower: reason.truck_supply_slower, faster: reason.truck_supply_faster}
  heat_index_c:                {slower: reason.heat_slower,         faster: reason.cool_faster}
  is_night:                    {slower: reason.night_slower}
  planned_quantity:            {slower: reason.quantity_large}   # a small task is not a "reason"
