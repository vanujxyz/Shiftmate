# Dozer profile (TRD §4.1). One load cycle = one push cycle; dozer tasks are not truck-dependent.
machine_type: dozer
display_name: {en: "Dozer", hi: "डोज़र", ta: "டோசர்"}
id_prefix: DOZ
example_models: ["Cat D6", "Cat D8"]
load_cycle_definition: "one push cycle"
passes_per_load: {min: 1, max: 1}
seconds_per_pass: {mean: 55, sd: 8}
fuel_lph: {idle: 3.5, working: 22.0, travel: 14.0}
rpm: {idle: 800, working: 1850}
max_travel_speed_kmh: 10
warm_up: {coolant_ready_c: 60, max_minutes_normal: 5, max_minutes_below_0c: 15}
idle:
  segment_min_seconds: 60
  habit_threshold_minutes: 5
  unattended_seat_empty_seconds: 120
proximity_m: {caution: 12.0, danger: 7.0, critical: 4.0}
unsafe:
  speed_near_person_kmh: 3.0
  continuous_operation_warn_min: 150
  continuous_operation_limit_min: 240
task_types: [grading, site_clearing, backfilling]
tasks:
  grading:       {quantity_unit: m2, base_rate_per_h: 600, typical_quantity: {min: 800, max: 2400}}
  site_clearing: {quantity_unit: m2, base_rate_per_h: 500, typical_quantity: {min: 600, max: 2000}}
  backfilling:   {quantity_unit: m3, base_rate_per_h: 150, typical_quantity: {min: 200, max: 600}}
