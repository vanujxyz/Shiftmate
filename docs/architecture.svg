<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ShiftMate architecture</title>
  <desc id="d">Machine side: simulator, edge gateway with per-machine engines and local store, cab app. Fleet side: fleet service with DuckDB and the console app. The edge syncs batched summaries to the fleet when the internet is available.</desc>
  <style>
    .band { fill: #F4F1EA; stroke: #151514; stroke-width: 2; }
    .box { fill: #FFFFFF; stroke: #151514; stroke-width: 2; }
    .app { fill: #FFFFFF; stroke: #151514; stroke-width: 3; }
    .h { font-size: 15px; font-weight: 700; fill: #151514; }
    .t { font-size: 12.5px; fill: #151514; }
    .m { font-size: 11.5px; fill: #4A4843; }
    .band-label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #4A4843; }
    .arrow { stroke: #151514; stroke-width: 2; fill: none; marker-end: url(#a); }
    .dash { stroke-dasharray: 7 5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#151514"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#FFFFFF"/>

  <!-- machine side -->
  <rect class="band" x="16" y="16" width="928" height="360" rx="10"/>
  <text class="band-label" x="36" y="44">MACHINE SIDE · EDGE (works with no internet)</text>

  <rect class="box" x="36" y="64" width="210" height="120" rx="6"/>
  <text class="h" x="52" y="90">Simulator</text>
  <text class="t" x="52" y="112">stands in for machine sensors</text>
  <text class="t" x="52" y="130">and the site world: trucks,</text>
  <text class="t" x="52" y="148">workers, weather · 1 Hz ticks</text>
  <text class="m" x="52" y="170">scenarios/ravi_shift · fleet_tour</text>

  <rect class="box" x="290" y="64" width="630" height="190" rx="6"/>
  <text class="h" x="306" y="90">Edge Gateway · Python, FastAPI · :8100</text>
  <text class="t" x="306" y="114">Per machine: signals → Safety → Risk → Idle reason → Intervals → Anomaly → Alert policy</text>
  <text class="t" x="306" y="136">Shared: task estimates (model from the fleet) · lesson recommender · report parser</text>
  <text class="t" x="306" y="158">Ask Cat: local retrieval over the manuals; Gemini when online, offline answers otherwise</text>
  <text class="t" x="306" y="180">Local store (SQLite) · outbox of summaries and shared events · scenario player</text>
  <text class="m" x="306" y="206">REST + WebSocket /ws/cab and /ws/site · private data stays on the machine</text>
  <text class="m" x="306" y="226">engines are pure: no I/O, no clock, no randomness</text>

  <line class="arrow" x1="246" y1="124" x2="288" y2="124"/>

  <rect class="app" x="290" y="282" width="360" height="78" rx="6"/>
  <text class="h" x="306" y="306">Cab app · React PWA (operator tablet) · :5173</text>
  <text class="t" x="306" y="328">en · हिन्दी · தமிழ் · alerts, voice, lessons, reports</text>
  <text class="m" x="306" y="348">webcam person detection runs in the browser: only distances leave</text>

  <line class="arrow" x1="470" y1="256" x2="470" y2="280"/>
  <line class="arrow" x1="500" y1="280" x2="500" y2="256"/>

  <!-- sync -->
  <line class="arrow dash" x1="700" y1="256" x2="700" y2="420"/>
  <text class="t" x="714" y="330">batched HTTPS when the site has internet</text>
  <text class="m" x="714" y="348">(the outbox queues while offline, then drains)</text>
  <line class="arrow dash" x1="820" y1="420" x2="820" y2="256"/>
  <text class="m" x="830" y="400">new estimation model</text>

  <!-- fleet side -->
  <rect class="band" x="16" y="400" width="928" height="224" rx="10"/>
  <text class="band-label" x="36" y="428">FLEET SIDE · CLOUD</text>

  <rect class="box" x="290" y="440" width="630" height="92" rx="6"/>
  <text class="h" x="306" y="466">Fleet Service · Python, FastAPI, DuckDB · :8200</text>
  <text class="t" x="306" y="488">ingest summaries and events · site aggregates · fleet patterns</text>
  <text class="t" x="306" y="508">estimation model training and versioned publishing · 10,000-machine scale stats</text>

  <rect class="app" x="36" y="440" width="222" height="168" rx="6"/>
  <text class="h" x="52" y="466">Console app · React</text>
  <text class="t" x="52" y="486">supervisor · :5174</text>
  <text class="t" x="52" y="510">live site map</text>
  <text class="t" x="52" y="530">site day and safety</text>
  <text class="t" x="52" y="550">fleet and scale</text>
  <text class="t" x="52" y="570">demo control</text>
  <text class="t" x="52" y="590">evaluation results</text>

  <line class="arrow" x1="288" y1="486" x2="260" y2="486"/>
  <path class="arrow" d="M 150 438 L 150 232 L 288 232"/>
  <text class="m" x="160" y="300">live site feed</text>
  <text class="m" x="160" y="316">and demo control</text>
</svg>
